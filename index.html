<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Navigation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e0f7fa 0%, #f3e5f5 40%, #fff8e1 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 60px 24px 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 48px;
        }
        .header h1 {
            font-size: 2.6rem;
            font-weight: 800;
            color: #5c6bc0;
        }
        .header p {
            color: #999;
            font-size: 0.85rem;
            margin-top: 6px;
            letter-spacing: 3px;
        }

        .search-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 50px;
        }
        .search-box {
            display: flex;
            align-items: center;
            background: #fff;
            border-radius: 50px;
            padding: 5px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            width: 100%;
            max-width: 540px;
            transition: box-shadow 0.3s;
        }
        .search-box:focus-within {
            box-shadow: 0 4px 32px rgba(92,107,192,0.18);
        }
        .search-box select {
            border: none;
            background: transparent;
            font-size: 0.85rem;
            color: #777;
            outline: none;
            padding: 10px 14px;
            cursor: pointer;
            border-right: 1px solid #eee;
            font-family: inherit;
        }
        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 0.95rem;
            padding: 10px 14px;
            background: transparent;
            color: #333;
            font-family: inherit;
        }
        .search-box input::placeholder { color: #bbb; }
        .search-box button {
            border: none;
            border-radius: 50px;
            padding: 10px 22px;
            background: linear-gradient(135deg, #7c4dff, #448aff);
            color: #fff;
            font-size: 0.9rem;
            cursor: pointer;
            font-family: inherit;
            transition: opacity 0.2s;
            white-space: nowrap;
        }
        .search-box button:hover { opacity: 0.85; }

        .section-title {
            font-size: 1rem;
            font-weight: 600;
            color: #888;
            margin-bottom: 16px;
            padding-left: 4px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 40px;
        }
        .card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 20px 22px;
            border-radius: 16px;
            text-decoration: none;
            color: #333;
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.9);
            transition: transform 0.25s, box-shadow 0.25s;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.08);
        }
        .card-icon {
            width: 46px; height: 46px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            flex-shrink: 0;
        }
        .card-info { flex: 1; min-width: 0; }
        .card-name {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 3px;
        }
        .card-desc {
            font-size: 0.78rem;
            color: #aaa;
        }
        .card-arrow {
            color: #ccc;
            font-size: 0.9rem;
            transition: color 0.2s, transform 0.2s;
        }
        .card:hover .card-arrow {
            color: #7c4dff;
            transform: translateX(3px);
        }

        .ic-purple { background: linear-gradient(135deg, #b388ff, #7c4dff); }
        .ic-blue   { background: linear-gradient(135deg, #80d8ff, #40c4ff); }
        .ic-green  { background: linear-gradient(135deg, #b9f6ca, #69f0ae); }
        .ic-orange { background: linear-gradient(135deg, #ffe082, #ffca28); }
        .ic-pink   { background: linear-gradient(135deg, #f8bbd0, #ff80ab); }
        .ic-teal   { background: linear-gradient(135deg, #b2dfdb, #4db6ac); }
        .ic-indigo { background: linear-gradient(135deg, #9fa8da, #5c6bc0); }

        .footer {
            text-align: center;
            margin-top: 60px;
            color: #bbb;
            font-size: 0.75rem;
            letter-spacing: 2px;
        }

        @media (max-width: 600px) {
            .header h1 { font-size: 1.8rem; }
            .cards { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>My Navigation</h1>
            <p>Collection &amp; Discovery</p>
        </div>

        <div class="search-wrap">
            <div class="search-box">
                <select id="engine">
                    <option value="https://www.google.com/search?q=">Google</option>
                    <option value="https://www.bing.com/search?q=">Bing</option>
                </select>
                <input type="text" id="search" placeholder="搜索… 回车跳转" autocomplete="off">
                <button onclick="doSearch()">搜索</button>
            </div>
        </div>

        <div class="section-title">我的收藏</div>
        <div class="cards">

            <a class="card" href="https://libretv.mzone.dpdns.org/" target="_blank">
                <div class="card-icon ic-purple">🎬</div>
                <div class="card-info">
                    <div class="card-name">LibreTV</div>
                    <div class="card-desc">影视中心</div>
                </div>
                <span class="card-arrow">→</span>
            </a>

            <a class="card" href="https://tongdao.mzone.dpdns.org/" target="_blank">
                <div class="card-icon ic-blue">🛡️</div>
                <div class="card-info">
                    <div class="card-name">VPN</div>
                    <div class="card-desc">代理订阅</div>
                </div>
                <span class="card-arrow">→</span>
            </a>

            <a class="card" href="https://newsnow.16781678.xyz/" target="_blank">
                <div class="card-icon ic-green">📰</div>
                <div class="card-info">
                    <div class="card-name">新闻资讯</div>
                    <div class="card-desc">实时资讯</div>
                </div>
                <span class="card-arrow">→</span>
            </a>

            <a class="card" href="https://shuji-conver.netlify.app/" target="_blank">
                <div class="card-icon ic-orange">🔄</div>
                <div class="card-info">
                    <div class="card-name">数据转换</div>
                    <div class="card-desc">在线格式转换</div>
                </div>
                <span class="card-arrow">→</span>
            </a>

            <a class="card" href="https://gentsergame.com/" target="_blank">
                <div class="card-icon ic-pink">📱</div>
                <div class="card-info">
                    <div class="card-name">APK Converter</div>
                    <div class="card-desc">APK转换工具</div>
                </div>
                <span class="card-arrow">→</span>
            </a>

        </div>

        <div class="section-title">推荐工具</div>
        <div class="cards">

            <a class="card" href="http://dc.wrd.kr:26750/" target="_blank">
                <div class="card-icon ic-indigo">⚡</div>
                <div class="card-info">
                    <div class="card-name">New Api</div>
                    <div class="card-desc">AI 接口平台</div>
                </div>
                <span class="card-arrow">→</span>
            </a>

            <a class="card" href="https://www.nodeloc.com/" target="_blank">
                <div class="card-icon ic-teal">💬</div>
                <div class="card-info">
                    <div class="card-name">NodeLoc</div>
                    <div class="card-desc">VPS 论坛社区</div>
                </div>
                <span class="card-arrow">→</span>
            </a>

            <a class="card" href="https://ping0.cc/" target="_blank">
                <div class="card-icon ic-purple">🔍</div>
                <div class="card-info">
                    <div class="card-name">IP检测</div>
                    <div class="card-desc">IP 纯净度检测</div>
                </div>
                <span class="card-arrow">→</span>
            </a>

        </div>

        <div class="footer">NAVIGATION v3.0 — BUILT WITH ♥</div>
    </div>

    <script>
        function doSearch() {
            const q = document.getElementById('search').value.trim();
            const engine = document.getElementById('engine').value;
            if (q) window.open(engine + encodeURIComponent(q), '_blank');
        }
        document.getElementById('search').addEventListener('keydown', e => {
            if (e.key === 'Enter') doSearch();
        });
    </script>
</body>
</html>
