<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Navigation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: #0a0a0a;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #fff;
        }

        canvas#bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1000px;
            margin: 0 auto;
            padding: 60px 24px 40px;
        }

        /* ---- HEADER ---- */
        .header {
            text-align: center;
            margin-bottom: 50px;
        }
        .header h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #a78bfa 0%, #60a5fa 40%, #34d399 70%, #fbbf24 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-shift 6s ease infinite;
        }
        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .header p {
            color: rgba(255,255,255,0.3);
            font-size: 0.9rem;
            margin-top: 8px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* ---- SEARCH ---- */
        .search-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 60px;
        }
        .search-box {
            position: relative;
            width: 100%;
            max-width: 560px;
        }
        .search-box input {
            width: 100%;
            padding: 16px 60px 16px 24px;
            border-radius: 60px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(20px);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }
        .search-box input:focus {
            border-color: rgba(167,139,250,0.5);
            box-shadow: 0 0 30px rgba(167,139,250,0.15);
            background: rgba(255,255,255,0.06);
        }
        .search-box input::placeholder { color: rgba(255,255,255,0.25); }
        .search-box button {
            position: absolute;
            right: 6px; top: 6px;
            width: 48px; height: 48px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .search-box button:hover { transform: scale(1.1); }

        /* ---- CARDS ---- */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            position: relative;
            border-radius: 20px;
            padding: 28px;
            text-decoration: none;
            color: #fff;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            backdrop-filter: blur(12px);
            overflow: hidden;
            transition: transform 0.35s cubic-bezier(.22,.68,0,1.2), border-color 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(167,139,250,0.08), transparent 60%);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .card:hover::before { opacity: 1; }
        .card:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: rgba(167,139,250,0.25);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3), 0 0 40px rgba(167,139,250,0.08);
        }

        .card-icon {
            width: 52px; height: 52px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }
        .card-icon::after {
            content: '';
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 16px;
            background: inherit;
            filter: blur(18px);
            opacity: 0.4;
            z-index: -1;
        }

        .card-body { flex: 1; z-index: 1; min-width: 0; }
        .card-name {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .card-desc {
            font-size: 0.82rem;
            color: rgba(255,255,255,0.35);
            line-height: 1.5;
        }
        .card-arrow {
            position: absolute;
            right: 20px; top: 50%;
            transform: translateY(-50%) translateX(4px);
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            color: rgba(255,255,255,0.4);
            font-size: 1rem;
        }
        .card:hover .card-arrow {
            opacity: 1;
            transform: translateY(-50%) translateX(0);
        }

        /* Glow accents per card */
        .card:nth-child(1) .card-icon { background: linear-gradient(135deg, #7c3aed, #a78bfa); }
        .card:nth-child(2) .card-icon { background: linear-gradient(135deg, #2563eb, #60a5fa); }
        .card:nth-child(3) .card-icon { background: linear-gradient(135deg, #059669, #34d399); }
        .card:nth-child(4) .card-icon { background: linear-gradient(135deg, #ea580c, #fb923c); }
        .card:nth-child(5) .card-icon { background: linear-gradient(135deg, #db2777, #f472b6); }

        /* ---- FLOATING ORBS ---- */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }
        .orb-1 {
            width: 400px; height: 400px;
            background: #7c3aed;
            top: -100px; left: -100px;
            animation: float-orb 20s ease-in-out infinite;
        }
        .orb-2 {
            width: 300px; height: 300px;
            background: #2563eb;
            bottom: -50px; right: -50px;
            animation: float-orb 25s ease-in-out infinite reverse;
        }
        .orb-3 {
            width: 250px; height: 250px;
            background: #059669;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation: float-orb 30s ease-in-out infinite;
        }
        @keyframes float-orb {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(60px, -40px); }
            50% { transform: translate(-30px, 60px); }
            75% { transform: translate(40px, 30px); }
        }

        /* ---- FOOTER ---- */
        .footer {
            text-align: center;
            margin-top: 70px;
            padding: 20px;
            color: rgba(255,255,255,0.15);
            font-size: 0.75rem;
            letter-spacing: 2px;
        }

        /* ---- MOBILE ---- */
        @media (max-width: 600px) {
            .header h1 { font-size: 2rem; }
            .cards { grid-template-columns: 1fr; }
            .card { padding: 20px; }
        }

        /* ---- GLOW LINE ---- */
        .glow-line {
            width: 80px; height: 2px;
            background: linear-gradient(90deg, transparent, #a78bfa, #60a5fa, transparent);
            margin: 20px auto 0;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <canvas id="bg"></canvas>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="container">
        <div class="header">
            <h1>Navigation</h1>
            <p>Collection &amp; Discovery</p>
            <div class="glow-line"></div>
        </div>

        <div class="search-wrap">
            <div class="search-box">
                <input type="text" id="search" placeholder="搜索… 回车跳转" autocomplete="off">
                <button onclick="doSearch()">⌕</button>
            </div>
        </div>

        <div class="cards">

            <a class="card" href="https://libretv.mzone.dpdns.org/" target="_blank">
                <div class="card-icon">🎬</div>
                <div class="card-body">
                    <div class="card-name">LibreTV</div>
                    <div class="card-desc">影视中心 — 免费在线视频平台</div>
                </div>
                <span class="card-arrow">→</span>
            </a>

            <a class="card" href="https://tongdao.mzone.dpdns.org/" target="_blank">
                <div class="card-icon">🛡️</div>
                <div class="card-body">
                    <div class="card-name">VPN</div>
                    <div class="card-desc">代理订阅 — 网络加速管理</div>
                </div>
                <span class="card-arrow">→</span>
            </a>

            <a class="card" href="https://newsnow.16781678.xyz/" target="_blank">
                <div class="card-icon">📰</div>
                <div class="card-body">
                    <div class="card-name">新闻资讯</div>
                    <div class="card-desc">实时资讯 — 全球新闻聚合</div>
                </div>
                <span class="card-arrow">→</span>
            </a>

            <a class="card" href="https://shuji-conver.netlify.app/" target="_blank">
                <div class="card-icon">🔄</div>
                <div class="card-body">
                    <div class="card-name">数据转换</div>
                    <div class="card-desc">在线格式转换工具</div>
                </div>
                <span class="card-arrow">→</span>
            </a>

            <a class="card" href="https://gentsergame.com/" target="_blank">
                <div class="card-icon">📱</div>
                <div class="card-body">
                    <div class="card-name">APK Converter</div>
                    <div class="card-desc">APK 转换工具</div>
                </div>
                <span class="card-arrow">→</span>
            </a>

        </div>

        <div class="footer">NAVIGATION v2.0 — BUILT WITH ♥</div>
    </div>

    <script>
        // ---- Starfield canvas ----
        const canvas = document.getElementById('bg');
        const ctx = canvas.getContext('2d');
        let W, H, stars = [];

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        for (let i = 0; i < 200; i++) {
            stars.push({
                x: Math.random() * W,
                y: Math.random() * H,
                r: Math.random() * 1.5 + 0.3,
                a: Math.random(),
                da: (Math.random() - 0.5) * 0.02,
                dx: (Math.random() - 0.5) * 0.15,
                dy: Math.random() * 0.2 + 0.05,
            });
        }

        function animate() {
            ctx.clearRect(0, 0, W, H);
            for (const s of stars) {
                s.a += s.da;
                if (s.a > 1 || s.a < 0.1) s.da *= -1;
                s.x += s.dx;
                s.y += s.dy;
                if (s.y > H + 10) { s.y = -10; s.x = Math.random() * W; }
                if (s.x > W + 10) s.x = -10;
                if (s.x < -10) s.x = W + 10;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,255,255,${s.a * 0.6})`;
                ctx.fill();
            }
            requestAnimationFrame(animate);
        }
        animate();

        // ---- Card mouse-follow glow ----
        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('mousemove', e => {
                const rect = card.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width * 100);
                const y = ((e.clientY - rect.top) / rect.height * 100);
                card.style.setProperty('--mx', x + '%');
                card.style.setProperty('--my', y + '%');
            });
        });

        // ---- Search ----
        function doSearch() {
            const q = document.getElementById('search').value.trim();
            if (q) window.open(`https://www.baidu.com/s?wd=${encodeURIComponent(q)}`, '_blank');
        }
        document.getElementById('search').addEventListener('keydown', e => {
            if (e.key === 'Enter') doSearch();
        });
    </script>
</body>
</html>
